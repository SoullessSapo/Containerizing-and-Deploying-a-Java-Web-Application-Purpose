<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" width="1040" height="620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>virtualization-lab deployment model</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <rect width="1040" height="620" fill="#ffffff"/>

  <!-- Developer workstation -->
  <rect x="20" y="40" width="250" height="250" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="36" y="66" font-size="15" font-weight="700" fill="#0f172a">Developer workstation</text>
  <text x="36" y="84" font-size="12" fill="#475569">Java 21 · Maven · Docker Desktop</text>
  <rect x="40" y="100" width="210" height="44" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="145" y="119" font-size="12.5" text-anchor="middle" fill="#0f172a">mvn clean package</text>
  <text x="145" y="135" font-size="11" text-anchor="middle" fill="#475569">target/virtualization-lab-1.0.0.jar</text>
  <line x1="145" y1="144" x2="145" y2="168" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="170" width="210" height="44" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="145" y="189" font-size="12.5" text-anchor="middle" fill="#0f172a">docker build (Dockerfile)</text>
  <text x="145" y="205" font-size="11" text-anchor="middle" fill="#475569">FROM amazoncorretto:21</text>
  <line x1="145" y1="214" x2="145" y2="238" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="240" width="210" height="36" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="145" y="263" font-size="12.5" text-anchor="middle" fill="#0c4a6e">image virtualization-lab:1.0</text>

  <!-- Docker Hub -->
  <rect x="660" y="40" width="330" height="92" rx="10" fill="#eff6ff" stroke="#1d4ed8"/>
  <text x="825" y="66" font-size="15" font-weight="700" text-anchor="middle" fill="#1e3a8a">Docker Hub (public registry)</text>
  <text x="825" y="88" font-size="12" text-anchor="middle" fill="#1e40af">&lt;dockerhub-user&gt;/virtualization-lab</text>
  <text x="825" y="106" font-size="12" text-anchor="middle" fill="#1e40af">tags: 1.0 · latest</text>

  <path d="M250 258 L 296 258 Q 304 258, 304 250 L 304 94 Q 304 86, 312 86 L 656 86" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="480" y="78" font-size="12" text-anchor="middle" fill="#1d4ed8">docker push (tags 1.0 and latest)</text>

  <!-- Client -->
  <rect x="20" y="420" width="250" height="110" rx="10" fill="#fefce8" stroke="#ca8a04"/>
  <text x="145" y="448" font-size="15" font-weight="700" text-anchor="middle" fill="#713f12">Client</text>
  <text x="145" y="470" font-size="12" text-anchor="middle" fill="#854d0e">browser / curl</text>
  <text x="145" y="494" font-size="11.5" text-anchor="middle" fill="#854d0e">GET http://&lt;ec2-public-dns&gt;:8080</text>
  <text x="145" y="510" font-size="11.5" text-anchor="middle" fill="#854d0e">/greeting?name=AWS</text>

  <!-- AWS cloud -->
  <rect x="330" y="170" width="690" height="430" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="348" y="196" font-size="15" font-weight="700" fill="#9a3412">AWS Cloud · Region us-east-1 · default VPC, public subnet</text>

  <!-- Security group -->
  <rect x="350" y="214" width="650" height="370" rx="10" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="366" y="238" font-size="13.5" font-weight="700" fill="#b91c1c">Security group (stateful firewall)</text>
  <text x="366" y="256" font-size="11.5" fill="#b91c1c">in: 22/tcp ← your IP/32 · 8080/tcp ← client network · all else denied</text>

  <!-- EC2 VM -->
  <rect x="380" y="272" width="600" height="296" rx="10" fill="#ffedd5" stroke="#c2410c"/>
  <text x="398" y="298" font-size="15" font-weight="700" fill="#7c2d12">EC2 virtual machine · Amazon Linux 2023 · t3.micro</text>
  <text x="398" y="316" font-size="11.5" fill="#9a3412">Nitro hypervisor: dedicated vCPUs, RAM, 8 GiB gp3 EBS, ENI + public IPv4</text>

  <!-- Docker engine -->
  <rect x="404" y="332" width="552" height="218" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="420" y="356" font-size="14" font-weight="700" fill="#075985">Docker Engine</text>
  <text x="420" y="373" font-size="11.5" fill="#0369a1">docker run -d --restart unless-stopped -e PORT=9000 -p 8080:9000</text>

  <!-- Container -->
  <rect x="560" y="388" width="376" height="146" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="576" y="412" font-size="14" font-weight="700" fill="#115e59">Container: virtualization-lab</text>
  <text x="576" y="430" font-size="11.5" fill="#0f766e">own namespaces (PID, network, mount) + cgroup limits</text>
  <rect x="576" y="442" width="344" height="80" rx="6" fill="#f0fdfa" stroke="#14b8a6"/>
  <text x="590" y="463" font-size="12.5" fill="#134e4a">Amazon Corretto 21 JVM</text>
  <text x="590" y="482" font-size="12.5" fill="#134e4a">Spring Boot 4.1.1 · embedded Tomcat :9000</text>
  <text x="590" y="501" font-size="12.5" fill="#134e4a">HelloRestController  GET /greeting</text>
  <text x="590" y="517" font-size="11" fill="#0f766e">port from env var PORT</text>

  <!-- Host port -->
  <rect x="420" y="440" width="112" height="46" rx="6" fill="#fff" stroke="#0369a1"/>
  <text x="476" y="460" font-size="12" text-anchor="middle" fill="#075985">host port</text>
  <text x="476" y="477" font-size="13" font-weight="700" text-anchor="middle" fill="#075985">8080</text>
  <line x1="532" y1="463" x2="574" y2="463" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="553" y="451" font-size="10.5" text-anchor="middle" fill="#334155">NAT</text>

  <!-- Client request -->
  <path d="M270 475 C 330 475, 350 463, 418 463" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="145" y="556" font-size="12" text-anchor="middle" fill="#334155">request → SG → host :8080 → container :9000</text>
  <text x="145" y="574" font-size="12" text-anchor="middle" fill="#334155">response ← "Hello, AWS!"</text>

  <!-- Pull -->
  <path d="M935 132 L 935 330" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="927" y="155" font-size="12" text-anchor="end" fill="#1d4ed8">docker pull</text>
</svg>
